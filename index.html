<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff8f4">
<title>오늘은 뭐 먹을까?</title>
<style>
:root{
  --ink:#292521;
  --muted:#7d746d;
  --paper:#fffdfa;
  --line:#eee5de;
  --red:#d71920;
  --orange:#ef7954;
  --peach:#fff0e9;
  --green:#467355;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(145deg,#fff7f2,#fffdfa 55%,#f6f6ed);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;
}
button,select{font:inherit}
button{cursor:pointer}
.wrap{max-width:1040px;margin:auto;padding:28px 20px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}
.brand{font-size:15px;font-weight:800;color:var(--orange);letter-spacing:.04em}
.clock{color:var(--muted);font-size:14px;font-weight:600}
.hero{max-width:720px;margin:20px auto 28px;text-align:center}
.eyebrow{color:var(--orange);font-size:13px;font-weight:800;letter-spacing:.12em}
.hero h1{font-size:clamp(32px,6vw,50px);line-height:1.18;margin:10px 0}
.hero p{color:var(--muted);margin:0;font-size:15px}
.panel{
  background:rgba(255,255,255,.92);
  border:1px solid var(--line);
  border-radius:22px;
  padding:22px;
  box-shadow:0 12px 36px #5a32100b;
}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field label{display:block;font-size:13px;color:var(--muted);font-weight:700;margin:0 0 8px}
.field select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);font-weight:600}
.datebox{padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:650}
.actions{display:flex;justify-content:center;gap:10px;margin:22px 0 0;flex-wrap:wrap}
.primary,.secondary{border:0;border-radius:999px;padding:14px 26px;font-weight:800;font-size:15px}
.primary{background:var(--red);color:white;box-shadow:0 6px 15px #d719202e}
.primary:hover{background:#b9151c}
.secondary{background:#f6eee8;color:#51463f}
.result{margin-top:24px;display:none}
.result.show{display:block}
.result-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.badge{font-size:13px;font-weight:800;padding:7px 12px;border-radius:999px;background:var(--peach);color:#b64c32}
.dish-card{
  margin-top:18px;
  padding:20px;
  border:1px solid var(--line);
  border-radius:20px;
  background:#fff;
  box-shadow:0 6px 20px #5a321008;
}
.dish-top{
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}
.dish-art{
  flex:0 0 154px;
  width:154px;
  height:154px;
  border-radius:20px;
  overflow:hidden;
  border:1px solid #efe1d5;
  background:#fff8f2;
  box-shadow:0 6px 16px #5a321012;
  display:flex;
  align-items:center;
  justify-content:center;
}
.dish-art svg{width:100%;height:100%;display:block}
.dish-art{position:relative}
.sprite-wrap{position:relative;width:100%;height:100%;overflow:hidden;border-radius:18px;background:#fff8f2}
.sprite-img{position:absolute;width:1000%;height:900%;max-width:none;display:block;pointer-events:none}
.dish-info{flex:1;min-width:200px}
.dish-tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cat-pill{
  font-size:12px;
  font-weight:800;
  padding:4px 9px;
  border-radius:999px;
  background:#f5efe9;
  color:#6a584c;
}
.dish{font-size:clamp(26px,5vw,38px);margin:8px 0 4px;line-height:1.2}
.meta{color:var(--muted);font-size:14px}
.calorie{font-size:17px;font-weight:800;color:var(--red);margin-top:10px}
.subgrid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:16px}
.subcard{padding:18px;border:1px solid var(--line);border-radius:16px;background:#fffdfa}
.subcard h3{font-size:16px;margin:0 0 10px}
.subcard p{margin:7px 0;color:#5e554f;line-height:1.65;font-size:14px}
.subcard ol{padding-left:20px;margin:8px 0 0;color:#5e554f;font-size:14px;line-height:1.75}
.serves{font-size:12px;color:var(--muted);font-weight:700}
.dessert-list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.dessert-item{
  padding:10px 12px;
  border-radius:12px;
  background:#fff6ef;
  border:1px solid #f4e4d7;
}
.dessert-item.drink{
  background:#f4f8f3;
  border-color:#e1ece0;
}
.dessert-tag{
  display:inline-block;
  font-size:11.5px;
  font-weight:800;
  color:#b65232;
  margin-bottom:3px;
}
.dessert-item.drink .dessert-tag{color:var(--green)}
.dessert-name{font-size:17px;font-weight:800;color:var(--ink)}
.dessert-note{font-size:12.5px;color:#6c625b;margin-top:6px;line-height:1.5}
.tip{margin-top:16px;padding:14px 16px;background:#f5f7ee;border-radius:14px;color:#4a5e44;font-size:13.5px;line-height:1.65}
.foot{text-align:center;color:#9a918b;font-size:12.5px;margin-top:20px}
.history{margin-top:16px;color:var(--muted);font-size:13px;text-align:center;font-weight:600}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#292521;color:white;padding:11px 18px;border-radius:99px;font-size:13px;display:none;z-index:99}
@media(max-width:680px){
  .wrap{padding:18px 14px 40px}
  .controls,.subgrid{grid-template-columns:1fr}
  .panel{padding:16px}
  .top{margin-bottom:18px}
  .dish-art{flex:0 0 124px;width:124px;height:124px}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="brand">🍚 한 끼 고민 끝</div>
    <div class="clock" id="clock"></div>
  </header>
  <section class="hero">
    <div class="eyebrow">오늘의 식탁을 골라드릴게요</div>
    <h1>오늘은 뭐 먹을까?</h1>
    <p>날씨와 계절에 어울리는 한 끼, 음식 그림과 레시피·제철 과일과 차·커피까지 한 번에 추천해요.</p>
  </section>
  <section class="panel">
    <div class="controls">
      <div class="field">
        <label for="weather">오늘 날씨</label>
        <select id="weather">
          <option value="맑음">☀️ 맑음</option>
          <option value="흐림">☁️ 흐림</option>
          <option value="비">🌧️ 비</option>
          <option value="눈">❄️ 눈</option>
        </select>
      </div>
      <div class="field">
        <label for="meal">먹을 시간</label>
        <select id="meal">
          <option value="아침">아침</option>
          <option value="점심">점심</option>
          <option value="저녁">저녁</option>
          <option value="야식">야식</option>
          <option value="간식">간식</option>
        </select>
      </div>
      <div class="field">
        <label>오늘 날짜</label>
        <div class="datebox" id="date"></div>
      </div>
      <div class="field">
        <label>추천 기준</label>
        <div class="datebox" id="season"></div>
      </div>
    </div>
    <div class="actions">
      <button class="primary" id="recommend">오늘의 메뉴 추천받기 ✨</button>
      <button class="secondary" id="share">카톡으로 공유</button>
    </div>
    <div class="result" id="result"></div>
    <div class="history" id="history"></div>
  </section>
  <div class="foot">추천 기록은 이 기기에 저장돼요 · 1주일(7일)이 지난 메뉴는 다시 추천될 수 있어요</div>
</main>
<div class="toast" id="toast"></div>

function detectStyle(name) {
  if (/(수박화채)/.test(name)) return 'hwachae';
  if (/(빙수)/.test(name)) return 'bingsu';
  if (/(붕어빵)/.test(name)) return 'bungeoppang';
  if (/(호떡)/.test(name)) return 'hotteok';
  if (/(호빵)/.test(name)) return 'hoppang';
  if (/(군고구마|고구마맛탕)/.test(name)) return 'sweet_potato';
  if (/(옥수수(?!수프|전))/.test(name)) return 'corn';
  if (/(콘치즈)/.test(name)) return 'corn_cheese';
  if (/(소떡소떡|떡꼬치|닭꼬치|어묵꼬치)/.test(name)) return 'skewer';
  if (/(핫도그)/.test(name)) return 'hotdog';
  if (/(계란말이)/.test(name)) return 'egg_roll';
  if (/(부대찌개)/.test(name)) return 'budae';
  if (/(삼계탕|백숙)/.test(name)) return 'samgyetang';
  if (/(떡국|떡만둣국)/.test(name)) return 'tteokguk';
  if (/(보쌈|족발)/.test(name)) return 'bossam';
  if (/(감바스)/.test(name)) return 'gambas';
  if (/(케이크|티라미수|스콘|소금빵|아포가토|차와|라떼|군밤|찐감자|계란빵|떡구이)/.test(name)) return 'cafe';
  if (/(샐러드|요거트|냉국|포케|에그슬럿)/.test(name)) return 'salad';
  if (/(죽|수프|오트밀)/.test(name)) return 'porridge';
  if (/(피자|퀘사디아)/.test(name)) return 'pizza';
  if (/(와플|크로플|팬케이크|프렌치토스트|인절미토스트)/.test(name)) return 'waffle';
  if (/(토스트|샌드위치|버거|베이글|크로와상|브리또|타코|브런치)/.test(name)) return 'sandwich';
  if (/(초밥|유부초밥)/.test(name)) return 'sushi';
  if (/(주먹밥|무스비)/.test(name)) return 'onigiri';
  if (/(김밥)/.test(name)) return 'gimbap';
  if (/(만두(?!국|전골))/.test(name)) return 'mandu';
  if (/(떡볶이|라볶이|타코야끼|순대볶음)/.test(name)) return 'tteokbokki';
  if (/(빈대떡|부침개|파전|김치전|감자전|부추전|애호박전|동태전|육전|고추전|깻잎전|배추전|옥수수전|모둠전)/.test(name)) return 'jeon';
  if (/(돈가스|생선가스|치킨가스)/.test(name)) return 'tonkatsu';
  if (/(치킨|닭강정|깐풍기|유린기|탕수육|꿔바로우|튀김|칠리새우|크림새우|감자튀김|치즈스틱|두부강정)/.test(name)) return 'fried';
  if (/(파스타|스파게티|알리오|봉골레)/.test(name)) return 'pasta';
  if (/(냉면|물회|콩국수|초계국수|냉모밀|열무국수|김치말이국수|중국냉면)/.test(name)) return 'cold_noodle';
  if (/(짜장면|간짜장|쟁반짜장|비빔국수|쫄면|막국수|볶음우동|야끼우동|볶음짬뽕|팟타이|분짜|골뱅이소면|잡채$)/.test(name)) return 'bibim_noodle';
  if (/(국수|칼국수|우동|라면|라멘|짬뽕|울면|탄탄멘|온모밀|수제비|옹심이)/.test(name)) return 'hot_noodle';
  if (/(구이)/.test(name) && /(고등어|갈치|삼치|가자미|조기|임연수|장어|전어|전복)/.test(name)) return 'fish_grill';
  if (/(조림|아구찜|오징어볶음|낙지볶음|주꾸미|쭈꾸미|고추잡채|양장피|바지락술찜)/.test(name) && !/(감자조림|연근조림|우엉조림|장조림|두부조림|닭조림)/.test(name)) return 'seafood_dish';
  if (/(비빔밥|회덮밥|알밥|보리밥)/.test(name)) return 'bibimbap';
  if (/(카레|하이라이스|짜장밥|마파두부|유산슬|리조또|그라탱)/.test(name)) return 'curry_rice';
  if (/(오므라이스|볶음밥|나시고랭|간장계란밥|명란밥)/.test(name)) return 'fried_rice';
  if (/(덮밥|규동|가츠동|오야코동|텐동|에비동|부타동|잡채밥)/.test(name)) return 'donburi';
  if (/(삼겹살|목살|항정살|불고기|갈비|떡갈비|스테이크|곱창|막창|주물럭|훈제|제육|닭갈비|닭발|닭똥집|찜닭|닭볶음탕|김치찜|두부김치|콩불|닭조림|숙주볶음)/.test(name)) return 'meat_grill';
  if (/(미역국|설렁탕|곰탕|갈비탕|북엇국|황태|소고기무국|콩나물국|조개탕|홍합탕|대구탕|만두국|연포탕|재첩국|어묵탕|들깨|샤브|밀푀유|만두전골|시금치된장국|아욱|배추된장국|냉이|매생이|굴국)/.test(name)) return 'clear_soup';
  if (/(찌개|탕|국|전골|스키야키|해장국|국밥|육개장|닭개장|마라)/.test(name)) return 'jjigae';
  return 'banchan';
}

// ================= 2. 재료 기반 자동 토핑 오버레이 (실제 음식과 매칭 강화) =================
function renderIngredientToppings(dish, cx, cy) {
  const txt = dish.name + ' ' + dish.ingredients;
  const parts = [];

  if (/(새우)/.test(txt)) {
    parts.push(`<g transform="translate(${cx - 22},${cy - 4}) scale(0.85)">
      <path d="M0 6 C-4 -6 14 -10 18 2 C20 8 10 13 6 8" fill="#ff825c" stroke="#c93e1d" stroke-width="1.8"/>
      <path d="M5 1 L10 5 M9 -2 L14 2" stroke="#ffe0d1" stroke-width="1.6"/>
    </g>`);
  }
  if (/(꽃게)/.test(txt)) {
    parts.push(`<g transform="translate(${cx + 8},${cy - 6}) scale(0.8)">
      <ellipse cx="0" cy="4" rx="13" ry="8" fill="#e04a2b" stroke="#9e2611" stroke-width="1.6"/>
      <path d="M-12 2 L-19 -5 M12 2 L19 -5 M-11 8 L-17 12 M11 8 L17 12" stroke="#c73519" stroke-width="2.2" stroke-linecap="round"/>
    </g>`);
  }
  if (/(바지락|조개|홍합|꼬막)/.test(txt)) {
    parts.push(`<g transform="translate(${cx + 16},${cy + 4}) scale(0.85)">
      <ellipse cx="0" cy="0" rx="10" ry="6.5" fill="#4f5861" stroke="#2c3238" stroke-width="1.4" transform="rotate(-15)"/>
      <ellipse cx="4" cy="2" rx="7" ry="4" fill="#f2d6a7"/>
    </g>`);
  }
  if (/(오징어|낙지|주꾸미|쭈꾸미)/.test(txt)) {
    parts.push(`<g transform="translate(${cx - 12},${cy + 4})">
      <circle cx="0" cy="0" r="7" fill="none" stroke="#fff0e6" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="7" fill="none" stroke="#d95b43" stroke-width="1.2" stroke-dasharray="3 2"/>
    </g>`);
  }
  if (/(순두부|두부)/.test(txt) && !/(유부)/.test(dish.name)) {
    parts.push(`<rect x="${cx - 26}" y="${cy - 8}" width="14" height="11" rx="2.5" fill="#fffaf0" stroke="#e2d1b3" stroke-width="1.2" transform="rotate(-10 ${cx - 19} ${cy - 2})"/>`);
  }
  if (/(달걀|계란)/.test(txt) && !/(계란말이|오므라이스|빵)/.test(dish.name)) {
    parts.push(`<g transform="translate(${cx + 2},${cy - 2})">
      <ellipse cx="0" cy="0" rx="11" ry="8" fill="#ffffff" stroke="#e6d7c3" stroke-width="1.1"/>
      <circle cx="0" cy="0" r="4.8" fill="#f7a41d"/>
    </g>`);
  }
  if (/(치즈|모차렐라|체다)/.test(txt) && !/(피자|콘치즈)/.test(dish.name)) {
    parts.push(`<path d="M${cx - 18} ${cy - 6} Q${cx} ${cy - 14} ${cx + 18} ${cy - 4} Q${cx + 8} ${cy + 6} ${cx - 6} ${cy + 2} Z" fill="#ffd94a" opacity="0.88" stroke="#e0a81b" stroke-width="1.2"/>`);
  }
  if (/(버섯|양송이|표고|느타리)/.test(txt)) {
    parts.push(`<g transform="translate(${cx + 20},${cy - 5}) scale(0.8)">
      <path d="M-8 2 Q0 -9 8 2 Z" fill="#9c724c" stroke="#664528" stroke-width="1.3"/>
      <rect x="-2.5" y="2" width="5" height="6" rx="1.5" fill="#f0e2ce"/>
    </g>`);
  }
  if (/(소시지|햄|스팸|베이컨)/.test(txt) && !/(부대찌개|핫도그)/.test(dish.name)) {
    parts.push(`<ellipse cx="${cx - 18}" cy="${cy + 6}" rx="9" ry="5" fill="#f07575" stroke="#c24848" stroke-width="1.3" transform="rotate(18 ${cx - 18} ${cy + 6})"/>`);
  }
  if (/(만두)/.test(txt) && !/(만두$)/.test(dish.name)) {
    parts.push(`<path d="M${cx - 12} ${cy + 6} Q${cx} ${cy - 8} ${cx + 12} ${cy + 6} Q${cx} ${cy + 12} ${cx - 12} ${cy + 6} Z" fill="#fff7e6" stroke="#d4b483" stroke-width="1.5"/>`);
  }
  if (/(연어)/.test(txt)) {
    parts.push(`<g transform="translate(${cx - 14},${cy - 4})">
      <rect x="0" y="0" width="22" height="11" rx="4" fill="#f27a49" stroke="#c95224" stroke-width="1.3"/>
      <line x1="5" y1="1" x2="9" y2="10" stroke="#ffd8c2" stroke-width="2"/>
      <line x1="13" y1="1" x2="17" y2="10" stroke="#ffd8c2" stroke-width="2"/>
    </g>`);
  }
  if (/(아보카도)/.test(txt)) {
    parts.push(`<path d="M${cx + 8} ${cy + 4} Q${cx + 18} ${cy - 8} ${cx + 26} ${cy + 4} Q${cx + 18} ${cy + 10} ${cx + 8} ${cy + 4} Z" fill="#7ec458" stroke="#3f7d2b" stroke-width="1.5"/>`);
  }
  if (/(시래기|미역|시금치|부추|미나리|콩나물|숙주|깻잎|청경채)/.test(txt)) {
    parts.push(`<path d="M${cx - 24} ${cy + 2} Q${cx - 10} ${cy - 6} ${cx + 4} ${cy + 3}" stroke="#448c42" stroke-width="3.2" fill="none" stroke-linecap="round"/>`);
  }
  return parts.slice(0, 3).join('');
}

    teasCool: ['시원한 식혜', '유자에이드'],
    coffeesWarm: ['따뜻한 아메리카노', '따뜻한 카페라떼', '카푸치노', '핸드드립 커피'],
    coffeesCool: ['아이스 아메리카노']
  }
};

function getSeasonalPairing(dish, season, weather, meal, idx) {
  const pool = SEASONAL_DESSERTS[season] || SEASONAL_DESSERTS['가을'];
  const hash = (dish.i * 7 + idx * 3 + new Date().getDate()) % 100;

  // 1) 현재 계절에 실제로 구할 수 있는 제철 과일 선택
  const fruit = pool.fruits[hash % pool.fruits.length];

  // 2) 음식 성격 + 날씨 + 식사 시간에 맞춰 차/커피 선택
  const isCafeDish = /(토스트|샌드위치|버거|베이글|크로와상|와플|팬케이크|파스타|스파게티|피자|샐러드|브런치|케이크|티라미수|스콘|소금빵|크로플|리조또|스테이크|함박|돈가스)/.test(dish.name);
  const isNight = (meal === '저녁' || meal === '야식');
  const wantWarm = (season === '겨울' || season === '가을' || weather === '비' || weather === '눈');

  let drink = '';
  let drinkType = '';

  if (isCafeDish && !isNight) {
    const cList = wantWarm ? pool.coffeesWarm : pool.coffeesCool;
    drink = cList[hash % cList.length];
    drinkType = '어울리는 커피';
  } else if (!isNight && (hash % 3 === 0)) {
    const cList = wantWarm ? pool.coffeesWarm : pool.coffeesCool;
    drink = cList[hash % cList.length];
    drinkType = '식후 커피';
  } else {
    const tList = wantWarm ? pool.teasWarm : pool.teasCool;
    drink = tList[hash % tList.length];
    drinkType = isNight ? '카페인 부담 없는 차' : '어울리는 차';
  }

  const reason = isNight
    ? `${season} 제철 과일로 입가심하고, 잠자리에 부담 없는 따뜻한 차로 마무리해 보세요.`
    : `${season}에 가장 맛있는 제철 과일과 ${weather} 날씨에 어울리는 한 잔을 골랐어요.`;

  return { fruit, drink, drinkType, reason };
}

function now() { return new Date(); }
function seasonOf(m) { return m >= 3 && m <= 5 ? '봄' : m >= 6 && m <= 8 ? '여름' : m >= 9 && m <= 11 ? '가을' : '겨울'; }
function timeMeal(h) {
  if (h >= 6 && h < 10) return '아침';
  if (h >= 10 && h < 15) return '점심';
  if (h >= 15 && h < 18) return '간식';
  if (h >= 18 && h < 21) return '저녁';
  return '야식';
}

function update() {
  const d = now();
  document.querySelector('#clock').textContent = d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  document.querySelector('#date').textContent = d.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
  document.querySelector('#season').textContent = seasonOf(d.getMonth() + 1) + ' 제철 메뉴 · 과일·차·커피';
  if (!document.activeElement || document.activeElement.id !== 'meal') {
    document.querySelector('#meal').value = timeMeal(d.getHours());
  }
}
update();
setInterval(update, 15000);

const KEY = 'what-to-eat-history-v1';
const LIMIT_DAYS = 7;

function getHistory() {
  try { return JSON.parse(localStorage.getItem(KEY) || '{}'); }
  catch { return {}; }
}

function showHistory() {
  const h = getHistory();
  const cut = Date.now() - LIMIT_DAYS * 864e5;
  const recent = Object.entries(h).filter(([, t]) => t > cut);
  document.querySelector('#history').textContent =
    `전체 메뉴 ${dishes.length}가지 · 최근 1주일 추천 기록 ${recent.length}개 (이 기기에 저장)`;
}
showHistory();

function recommend() {
  const d = now();
  const season = seasonOf(d.getMonth() + 1);
  const weather = document.querySelector('#weather').value;
  const meal = document.querySelector('#meal').value;

  let h = getHistory();
  const cut = Date.now() - LIMIT_DAYS * 864e5;
  for (const [n, t] of Object.entries(h)) {
    if (t <= cut) delete h[n];
  }

  let candidates = dishes.filter(x =>
    x.meals.includes(meal) && x.weathers.includes(weather) && x.seasons.includes(season) && !h[x.name]
  );
  let tags = [];

  if (candidates.length < 3) {
    const wider = dishes.filter(x =>
      x.meals.includes(meal) && x.seasons.includes(season) && !h[x.name] && !candidates.includes(x)
    );
    candidates.push(...wider);
    if (wider.length) tags.push('조건에 맞는 메뉴가 적어 날씨 조건을 넓혔어요');
  }
  if (candidates.length < 3) {
    const wider = dishes.filter(x =>
      x.meals.includes(meal) && !h[x.name] && !candidates.includes(x)
    );
    candidates.push(...wider);
    if (wider.length) tags.push('계절 조건도 넓혀 골랐어요');
  }
  if (candidates.length < 3) {
    h = {};
    candidates = dishes.filter(x => x.meals.includes(meal));
    tags.push('추천 가능한 메뉴를 모두 사용해 기록을 새로 시작했어요');
  }
  if (!candidates.length) candidates = dishes.filter(x => x.meals.includes('점심'));

  for (let i = candidates.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }

  const picks = candidates.slice(0, 3);
  picks.forEach(x => h[x.name] = Date.now());
  localStorage.setItem(KEY, JSON.stringify(h));

  const result = document.querySelector('#result');
  result.innerHTML = `
    <div class="result-head">
      <span class="badge">${season} · ${weather} · ${meal}</span>
      <span class="serves">오늘의 추천 3가지</span>
    </div>
    ${picks.map((dish, i) => {
      const pair = getSeasonalPairing(dish, season, weather, meal, i);
      return `
      <section class="dish-card">
        <div class="dish-top">
          <div class="dish-art">${(window.__svgFallback[i] = renderFoodSVG(dish, i), renderDishMedia(dish, i))}</div>
          <div class="dish-info">
            <div class="dish-tags">
              <span class="serves">추천 ${i + 1} · 2인 기준</span>
              <span class="cat-pill">${STYLE_LABEL[detectStyle(dish.name)]}</span>
            </div>
            <h2 class="dish">${dish.name}</h2>
            <div class="meta">오늘의 ${season} 추천 메뉴</div>
            <div class="calorie">1인 섭취량 약 ${dish.cal} kcal</div>
          </div>
        </div>
        <div class="subgrid">
          <article class="subcard">
            <h3>🍳 간단 조리법</h3>
            <div class="serves">재료 (2인분)</div>
            <p>${dish.ingredients}</p>
            <ol>
              <li>${dish.recipe}</li>
              <li>간을 본 뒤 나누어 담아 즐겨요. 칼로리는 재료와 양에 따라 달라질 수 있어요.</li>
            </ol>
          </article>
          <article class="subcard">
            <h3>🍊 ${season} 제철 후식 추천</h3>
            <div class="dessert-list">
              <div class="dessert-item">
                <span class="dessert-tag">${season} 제철 과일</span>
                <div class="dessert-name">${pair.fruit}</div>
              </div>
              <div class="dessert-item drink">
                <span class="dessert-tag">${pair.drinkType}</span>
                <div class="dessert-name">${pair.drink}</div>
              </div>
            </div>
            <p class="dessert-note">${pair.reason}</p>
          </article>
        </div>
      </section>`;
    }).join('')}
    <div class="tip">
      ${tags.length ? 'ℹ️ ' + tags.join(' · ') : '🌿 ' + season + ' 계절감과 ' + weather + ' 날씨를 고려했어요'}<br>
      추천한 메뉴 3가지는 각각 <strong>1주일(7일)</strong> 동안 다시 추천하지 않아요.
    </div>
  `;
  result.classList.add('show');
  showHistory();
}

document.querySelector('#recommend').addEventListener('click', recommend);

document.querySelector('#share').addEventListener('click', async () => {
  const title = '오늘은 뭐 먹을까?';
  const names = [...document.querySelectorAll('.dish')].map(x => x.textContent);
  const calories = [...document.querySelectorAll('.calorie')].map(x => x.textContent);
  const text = names.length
    ? `${title}\n${names.map((n, i) => `${i + 1}. ${n} · ${calories[i]}`).join('\n')}`
    : `${title} — 오늘 메뉴를 같이 골라봐요!`;
  if (window.AndroidShare && window.AndroidShare.shareToKakao) {
    window.AndroidShare.shareToKakao(text + '\n' + location.href);
    return;
  }
  if (navigator.share) {
    try { await navigator.share({ title, text, url: location.href }); } catch (e) {}
  } else {
    try {
      await navigator.clipboard.writeText(text + '\n' + location.href);
      toast('공유 문구를 복사했어요. 카카오톡에 붙여넣으세요.');
    } catch (e) {
      toast('공유 문구: ' + text);
    }
  }
});

function toast(t) {
  const el = document.querySelector('#toast');
  el.textContent = t;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2800);
}
</script>
</body>
</html>
